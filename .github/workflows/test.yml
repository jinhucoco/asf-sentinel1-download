name: test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Syntax check all Python
        run: |
          set -e
          for f in $(find . -name '*.py' -not -path './.git/*' -not -path '*/__pycache__/*'); do
            python -m py_compile "$f"
          done
          echo "All Python syntax OK"

      - name: Check bat control chars (Windows-only files, scan only)
        run: |
          python - <<'EOF'
          import glob
          bad = []
          for f in glob.glob('experiment/bat/**/*.bat', recursive=True):
              d = open(f, 'rb').read()
              n = sum(d.count(c) for c in (b'\x07', b'\x08', b'\x09'))
              if n:
                  bad.append(f'{f}: {n}')
          if bad:
              print('BAT control-char corruption found:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('All bat files clean (no \\b \\a \\t corruption)')
          EOF
